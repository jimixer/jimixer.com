name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # OIDC トークンの発行に要る。恒久的なアクセスキーを置かないための条件
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate gallery content
        run: npm run gallery:validate

      - name: Build website
        run: npm run build --workspace=website

      - name: Configure AWS credentials
        # OIDC でロールを引き受ける。発行されるのはこのジョブ1回分の資格情報で、
        # 権限はサイトの配信に必要な範囲だけ（infrastructure/lib/github-actions-deploy-role.ts）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-website-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name JimixerComStack \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' \
            --output text)

          # ハッシュ付き静的アセットは長期キャッシュ
          aws s3 sync website/out/_next/static/ s3://$BUCKET_NAME/_next/static/ \
            --delete --cache-control "public, max-age=31536000, immutable"

          # HTML・sitemap・robots.txt 等は毎回再検証
          aws s3 sync website/out/ s3://$BUCKET_NAME --delete \
            --exclude "_next/static/*" \
            --cache-control "public, no-cache"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name JimixerComStack \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)

          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"
